<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayze & Neal | Guest Invitation</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#faf7f3,#eee7df);color:#4b4038;font-family:Georgia,serif}
.card{width:min(520px,100%);padding:48px 34px;text-align:center;background:#fffdfb;border:1px solid #e5dbd2;border-radius:28px;box-shadow:0 25px 70px #5b463822}
.ornament{font-size:34px;color:#8d7665}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#927e6d}
h1{margin:12px 0;font-family:"Wedding Calligraphy","Segoe Script","Snell Roundhand",cursive;font-size:76px;font-weight:400;line-height:1;color:#625348}
.sub{line-height:1.7;color:#786b62;margin:0 auto 30px;max-width:390px}
label{display:block;text-align:left;font:600 12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
input{width:100%;padding:17px;border:1px solid #d5c8bd;border-radius:14px;font:16px Georgia,serif;outline:0}
input:focus{border-color:#927d6b;box-shadow:0 0 0 4px #927d6b18}
button{width:100%;margin-top:16px;padding:17px;border:0;border-radius:14px;background:#66564a;color:white;font:600 13px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.note{font:12px Arial,sans-serif;color:#988a80;margin-top:20px}
.modal{display:none;position:fixed;inset:0;background:#261f1a99;backdrop-filter:blur(6px);place-items:center;padding:24px}
.modal.show{display:grid}
.box{width:min(420px,100%);padding:36px 28px 28px;border-radius:24px;background:#fffdfb;text-align:center;box-shadow:0 25px 80px #0004}
.box h2{margin:8px 0 10px;font-size:25px;font-weight:500}
.box p{color:#6f6259;line-height:1.6;margin-bottom:22px}
.box button{width:auto;min-width:130px;margin:0;padding:12px 22px}
.icon{font-size:36px}
</style>
</head>
<body>
<main class="card">
<div class="ornament">❦</div>
<div class="eyebrow">You are invited to celebrate</div>
<h1>Kayze &amp; Neal</h1>
<p class="sub">Please enter your full name exactly as it appears on your invitation to open your wedding invitation.</p>
<form id="guestForm">
<label for="name">Full Name</label>
<input id="name" type="text" placeholder="Enter your full name" autocomplete="name" required>
<button type="submit">Open My Invitation</button>
</form>
<p class="note">Invitations are for specifically named guests only.</p>
</main>

<div class="modal" id="modal">
<div class="box">
<div class="icon" id="icon">♡</div>
<h2 id="title"></h2>
<p id="message"></p>
<button id="modalBtn">Try Again</button>
</div>
</div>

<script>
const INVITATION_URL = "https://yourbestvapartner.my.canva.site/kayze-x-neal";
const guestList = [

];

function normalize(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase();
}
const allowed = new Set(guestList.map(normalize));
const form=document.getElementById("guestForm");
const input=document.getElementById("name");
const modal=document.getElementById("modal");
const title=document.getElementById("title");
const message=document.getElementById("message");
const icon=document.getElementById("icon");
const btn=document.getElementById("modalBtn");

form.addEventListener("submit",function(e){
  e.preventDefault();
  const entered=input.value.trim();
  if(!entered)return;
  if(allowed.has(normalize(entered))){
    icon.textContent="♡";
    title.textContent="Invitation Found!";
    message.textContent="Welcome, "+entered+". Your invitation is ready to open.";
    btn.textContent="Open Invitation";
    btn.onclick=()=>window.location.href=INVITATION_URL;
  }else{
    icon.textContent="!";
    title.textContent="Guest Not Found";
    message.textContent="We’re sorry, but we couldn’t find that name on our guest list. Please check the spelling and enter your full name as written on your invitation.";
    btn.textContent="Try Again";
    btn.onclick=()=>{modal.classList.remove("show");input.focus();input.select();};
  }
  modal.classList.add("show");
});
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show");});
</script>
</body>
</html>
